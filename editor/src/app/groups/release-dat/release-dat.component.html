<div class="tangy-content-top-margin">
  @if (!buildDatIsComplete&&!errorGeneratingDat) {
    <p>
      {{'Your Dat Archive is building...'|translate}}
    </p>
  }
  @if (errorGeneratingDat) {
    <p>{{'Could Not Generate Dat Archive'|translate}}</p>
  }
  @if (buildDatIsComplete) {
    <p>
      {{'View your Dat Archive'|translate}}<br>
      <input value="{{datArchiveUrl}}">
    </p>
  }
</div>
