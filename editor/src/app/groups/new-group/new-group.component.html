<h1>
  {{'New Group'|translate}}
</h1>
@if (!ready) {
  <div>
    Loading...
  </div>
}
@if (ready) {
  <form novalidate (ngSubmit)="createGroup()" #newGroupForm="ngForm">
    <mat-form-field>
      <input
        name="groupNameInput"
        [(ngModel)]="groupName"
        #groupNameInput="ngModel"
        matInput
        placeholder="{{'Group Name'|translate}}"
        required
        >
      @if ((groupNameInput.invalid||groupNameInput.errors) && (groupNameInput.dirty || groupNameInput.touched)) {
        <mat-error
          >
          {{'This Field is Required'|translate}}
        </mat-error>
      }
    </mat-form-field>
    <br>
      @if (contentSets.length > 0) {
        <mat-form-field appearance="fill">
          <mat-label>Content Set</mat-label>
          <select matNativeControl required name="contentSetSelect" [(ngModel)]="contentSet">
            @for (contentSet of contentSets; track contentSet) {
              <option value="{{contentSet.id}}">{{contentSet.label}}</option>
            }
          </select>
        </mat-form-field>
      }
      <br>
        <br>
          <button
            [disabled]="newGroupForm.invalid"
            mat-raised-button color="warn"
            type="submit">
            {{'Submit'|translate}}
          </button>
        </form>
      }
