@if (participantInfo.caseEventHasEventFormsForParticipantsRole) {
  <div class="form-cards"
    >
    <h2 [innerHTML]="participantInfo.renderedListItem|unsanitizeHtml"></h2>
    @if (participantInfo.eventFormsParticipantCanCreate && participantInfo.eventFormsParticipantCanCreate.length > 0) {
      <div
        class="new-form-container"
        >
        <paper-fab
          class="new-form-button"
          routerLink="{{participantInfo.newFormLink}}"
          icon="add"
          >
        </paper-fab>
      </div>
    }
    @for (eventFormInfo of participantInfo.eventFormInfos; track eventFormInfo) {
      <app-event-form-list-item
        [case]="caseService.case"
        [caseDefinition]="caseService.caseDefinition"
        [caseEvent]="caseEvent"
        [caseEventDefinition]="caseEventDefinition"
        [eventForm]="eventFormInfo.eventForm"
        [eventFormDefinition]="eventFormInfo.eventFormDefinition"
        (formDeletedEvent)="onDeleteFormClick(eventFormInfo.eventForm.id)"
        (formArchivedEvent)="onArchiveFormClick(eventFormInfo.eventForm.id)"
        (formUnarchivedEvent)="onUnarchiveFormClick(eventFormInfo.eventForm.id)"
        class="form {{eventFormInfo.eventFormDefinition.required ? 'required' : ''}}"
        >
      </app-event-form-list-item>
    }
  </div>
}
