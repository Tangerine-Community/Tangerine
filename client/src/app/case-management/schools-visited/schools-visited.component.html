<!-- The month value is 0 indexed to correspond to Javascript's zero index on date.getMonth()-->
<select name="datefilter" id="datefiler" (change)="onSelectDate($event)">
  <option value="_">{{'Filter'|translate}}</option>
  @for (date of filterValuesForDates; track date) {
    <option [value]="date.value">{{date.label}}</option>
  }
</select>
<mat-list>
  <mat-list-item class="tangy-location-list">
    <span class="tangy-foreground-primary">{{'School'|translate}}</span>
    <span class="tangy-spacer"></span>
    <span class="tangy-foreground-primary">{{'Visits'|translate}}</span>
  </mat-list-item>
  @for (location of visits; track location) {
    <mat-list-item class="tangy-location-list">
      <a class="tangy-foreground-primary" [routerLink]="['/case-details']" [queryParams]="{locationId:location.id}">
        <i class="material-icons mat-18 tangy-location-list-icon">open_in_new</i>
      </a>
      <span [innerHTML]="location.location|unsanitizeHtml"></span>
      <span class="tangy-spacer"></span>
      <span>{{location.visits}}</span>
    </mat-list-item>
  }
  @if (visits.length<=0) {
    <mat-list-item class="tangy-location-list">{{'No Data for'|translate}} {{currentDate|date:'MMM, yyyy'}}</mat-list-item>
  }
</mat-list>
