@if (loaded && !hasEventFormRedirect) {
  <app-case-breadcrumb
    [caseId]="caseService.case._id"
    [caseEventId]="caseEvent.id"
    [eventFormId]="eventForm.id"
  ></app-case-breadcrumb>
}
@if (hasEventFormRedirect) {
  <div
    class="event-form-redirect-back-button"
    (click)="eventFormRedirect()"
    >
    <mwc-icon class="icon">chevron_left</mwc-icon> <span [innerHTML]="eventFormRedirectBackButtonText|unsanitizeHtml"></span>
  </div>
}
@if (loaded && allowCreationOfIssues && isFormComplete) {
  <paper-button class="new-issue-button" routerLink="/new-issue/{{caseId}}/{{caseEvent.id}}/{{eventForm.id}}/use-templates"><mwc-icon>playlist_add</mwc-icon> {{'new issue'|translate}}</paper-button>
}
<app-tangy-forms-player #formPlayer></app-tangy-forms-player>
