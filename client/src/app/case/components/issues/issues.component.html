@if (loading) {
  <div class="loading">Loading...</div>
}
@if (issues && issues.length === 0) {
  <div class="no-issues-found">No issues found.</div>
}
<div [hidden]="loading">
  @for (issue of issues; track issue) {
    <div class="icon-list-item search-result" routerLink="/issue/{{issue._id}}">
      <mwc-icon slot="item-icon">receipt</mwc-icon>
      <div>
        <div>{{issue.label}}</div>
        <div secondary>
        </div>
      </div>
    </div>
  }
</div>
