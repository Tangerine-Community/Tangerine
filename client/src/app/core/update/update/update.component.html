<div id="container">
  <h1>
    {{message}}
  </h1>
  @if (needsUpdating) {
    <h1>
      {{'Total Updates Applied'|translate}}: {{totalUpdatesApplied}}
    </h1>
  }
  @if (complete) {
    <paper-button routerLink="/home" mat-raised-button>
      {{'continue'|translate}}
    </paper-button>
  }
</div>
